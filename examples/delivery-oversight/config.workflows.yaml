workflows:
  delivery-oversight:
    entry: assess
    stages:
      assess:
        activity: agent
        requiresApproval: false
        with:
          template: triage-assign
          allowedTools: [mcp__wake__wake_github_read, mcp__wake__wake_github_assign]
          vars:
            # Optional operator input, not a trigger objective or mutable goal.
            focus: Finish active deliveries before starting unrelated work.
        execution: { workspace: none, runnerPool: standard }
        on:
          done: { then: done }
          failed: { then: done, retry: { max: 1 } }
          blocked: { then: await-human }
