default:
  stages:
    implement:
      activity: agent
      with: { prompt: '[fake:blocked] wait for review' }
      execution: { workspace: none, runnerPool: standard }
      on:
        blocked: { then: await-human }
  watches:
    - id: review
      while: { stages: [implement], statuses: [waiting] }
      on: { events: [fake.review-requested, orchestration.child-completed] }
      workflow: reviewer
      maxPerGroup: 1
reviewer:
  stages:
    review:
      activity: agent
      with: { prompt: complete the review }
      execution: { workspace: none, runnerPool: standard }
      on:
        done: { then: done }
