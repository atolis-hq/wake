default:
  stages:
    attempt:
      activity: agent
      with: { prompt: '[fake:failed] simulated first attempt' }
      execution: { workspace: none, tier: standard }
      on:
        failed: { then: recover }
    recover:
      activity: agent
      with: { prompt: recover successfully }
      execution: { workspace: none, tier: standard }
      on:
        done: { then: publish }
    publish:
      activity: status.publish
      with: { body: recovered }
      on:
        done: { then: done }
