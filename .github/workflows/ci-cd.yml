name: CI/CD

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  changes:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci-cd.yml'
              - '.dockerignore'
              - 'docker/**'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/**'
              - 'assets/**'
              - 'dependency-cruiser.config.mjs'
              - 'eslint.config.js'
              - 'knip.json'
              - 'prompts/**'
              - 'scripts/**'
              - 'src/**'
              - 'test/**'
              - 'tsconfig*.json'
              - 'vitest*.config.ts'

  release-version:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine next version
        id: semver
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: 'v'
          major_pattern: '(MAJOR)'
          minor_pattern: '(MINOR)'

  fast-verify:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run fast verification
        run: npm run verify
      - name: Diagnose formatting failure
        if: failure()
        run: |
          npx prettier --write .
          git diff --stat
          git diff

  architecture:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:architecture

  package-contract:
    needs: [changes, release-version]
    if: "always() && needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Set Wake version from release version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          WAKE_VERSION: ${{ needs.release-version.outputs.version }}
        run: npm pkg set version="$WAKE_VERSION"
      - name: Build package archive
        env:
          WAKE_BUILD_TAG: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && format('v{0}', needs.release-version.outputs.version) || '' }}
        run: |
          npm run build
          npm run build:web
          mkdir artifacts
          npm pack --ignore-scripts --json --pack-destination artifacts
      - name: Verify package archive
        run: node scripts/check-workspace-packages.mjs --archive artifacts/*.tgz
      - name: Upload release package
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: wake-package-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  knip:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run knip

  integration:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  web:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:web

  docker-smoke:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          tags: wake-ci-smoke
          load: true
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,mode=max,scope=docker-smoke
      - name: Run tick with fake sources
        run: |
          docker run --rm \
            --entrypoint sh \
            wake-ci-smoke \
            -c 'node /app/dist/src/main.js init /tmp/wake-smoke &&
                node /app/dist/src/main.js tick --wake-root /tmp/wake-smoke --no-sandbox'

  tag:
    needs:
      [
        release-version,
        fast-verify,
        architecture,
        package-contract,
        knip,
        integration,
        e2e,
        web,
        docker-smoke,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.release-version.outputs.version }} ${{ github.sha }}
          git push origin v${{ needs.release-version.outputs.version }}

  publish:
    needs: [tag]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download verified Wake package
        uses: actions/download-artifact@v5
        with:
          name: wake-package-${{ github.sha }}
          path: artifacts
      - name: Publish Wake
        run: npm publish ./artifacts/atolis-hq-wake-${{ needs.tag.outputs.version }}.tgz --workspaces=false --access public --provenance
