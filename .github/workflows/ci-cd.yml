name: CI/CD

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  changes:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci-cd.yml'
              - '.dockerignore'
              - 'docker/**'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/**'
              - 'assets/**'
              - 'dependency-cruiser.config.mjs'
              - 'eslint.config.js'
              - 'knip.json'
              - 'prompts/**'
              - 'scripts/**'
              - 'src/**'
              - 'test/**'
              - 'tsconfig*.json'
              - 'vitest*.config.ts'

  fast-verify:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run fast verification
        run: npm run verify
      - name: Diagnose formatting failure
        if: failure()
        run: |
          npx prettier --write .
          git diff --stat
          git diff

  architecture:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:architecture

  package-contract:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:workspace-packages

  knip:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run knip

  integration:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  web:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:web

  docker-smoke:
    needs: changes
    if: "needs.changes.outputs.relevant == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: wake-ci-smoke
          load: true
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,mode=max,scope=docker-smoke
      - name: Run tick with fake sources
        run: |
          docker run --rm \
            --entrypoint sh \
            wake-ci-smoke \
            -c 'node /app/dist/src/main.js init /tmp/wake-smoke &&
                node /app/dist/src/main.js tick --wake-root /tmp/wake-smoke --no-sandbox'

  tag:
    needs: [fast-verify, architecture, package-contract, knip, integration, e2e, web, docker-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine next version
        id: semver
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: 'v'
          major_pattern: '(MAJOR)'
          minor_pattern: '(MINOR)'
      - name: Push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.semver.outputs.version }}
          git push origin v${{ steps.semver.outputs.version }}

  publish:
    needs: [tag]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Set public workspace versions from tag
        env:
          WAKE_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          npm --workspace @atolis-hq/eventing version "$WAKE_VERSION" --no-git-tag-version --ignore-scripts
          npm --workspace @atolis-hq/eventing-filesystem version "$WAKE_VERSION" --no-git-tag-version --ignore-scripts
          npm version "$WAKE_VERSION" --workspaces=false --no-git-tag-version --ignore-scripts
          npm --workspace @atolis-hq/eventing-filesystem pkg set dependencies.@atolis-hq/eventing="$WAKE_VERSION"
          npm pkg set dependencies.@atolis-hq/eventing="$WAKE_VERSION" dependencies.@atolis-hq/eventing-filesystem="$WAKE_VERSION"
          npm install --package-lock-only --ignore-scripts
      - name: Verify public package archives
        run: npm run check:workspace-packages
        env:
          WAKE_BUILD_TAG: ${{ needs.tag.outputs.version }}
      - name: Publish Eventing
        run: npm --workspace @atolis-hq/eventing publish --access public --provenance
      - name: Publish Eventing filesystem
        run: npm --workspace @atolis-hq/eventing-filesystem publish --access public --provenance
      - name: Publish Wake
        run: npm publish --workspaces=false --access public --provenance
        env:
          WAKE_BUILD_TAG: ${{ needs.tag.outputs.version }}
