default:
  entry: refine
  stages:
    refine:
      activity: agent
      with: { prompt: 'refine the ticket' }
      execution: { workspace: none, runnerPool: standard }
      on:
        done: { then: implement }
    implement:
      activity: agent
      with: { prompt: 'implement the ticket' }
      execution: { workspace: none, runnerPool: standard }
      on:
        done: { then: done }
